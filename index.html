<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookCine — Track Books & Movies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #f8f9fb;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f0f2f5;
      --bg-card: #ffffff;
      --border: #e2e6ea;
      --border-subtle: #eef0f3;
      --text-primary: #1a1d23;
      --text-secondary: #5a6072;
      --text-muted: #8b93a5;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-light: #eef2ff;
      --accent-2: #ec4899;
      --accent-2-light: #fdf2f8;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --star-empty: #d1d5db;
      --star-filled: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.1), 0 4px 10px rgba(0,0,0,0.05);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
      --transition: 0.18s ease;
    }
    [data-theme="dark"] {
      --bg-primary: #0f1117;
      --bg-secondary: #1a1d27;
      --bg-tertiary: #232636;
      --bg-card: #1e2130;
      --border: #2e3248;
      --border-subtle: #252840;
      --text-primary: #e8eaf0;
      --text-secondary: #9ba3be;
      --text-muted: #636b85;
      --accent: #818cf8;
      --accent-hover: #6366f1;
      --accent-light: #1e2040;
      --accent-2: #f472b6;
      --accent-2-light: #2a1528;
      --danger: #f87171;
      --danger-light: #2a1515;
      --star-empty: #3d4261;
      --star-filled: #fbbf24;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.5);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; min-height: 100vh; transition: background var(--transition), color var(--transition); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* Header */
    .app-header { background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 0 24px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm); }
    .header-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 16px; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .logo-text { font-size: 20px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.5px; }
    .logo-text span { background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .dark-toggle { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-tertiary); color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all var(--transition); }
    .dark-toggle:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

    /* Nav Tabs */
    .nav-tabs { background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 0 24px; }
    .nav-tabs-inner { max-width: 1100px; margin: 0 auto; display: flex; gap: 4px; }
    .tab-btn { padding: 14px 20px; border: none; background: none; color: var(--text-muted); font-family: var(--font); font-size: 14px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all var(--transition); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .tab-btn:hover { color: var(--text-primary); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-btn .badge { background: var(--accent-light); color: var(--accent); font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 20px; min-width: 20px; text-align: center; }
    .tab-btn.active .badge { background: var(--accent); color: white; }

    /* Main */
    .main { max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Toolbar */
    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .search-wrap { position: relative; flex: 1; min-width: 200px; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 16px; pointer-events: none; }
    .search-input { width: 100%; padding: 10px 12px 10px 38px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-secondary); color: var(--text-primary); font-family: var(--font); font-size: 14px; transition: border-color var(--transition), box-shadow var(--transition); }
    .search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }
    .search-input::placeholder { color: var(--text-muted); }
    .filter-select { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-secondary); color: var(--text-primary); font-family: var(--font); font-size: 14px; cursor: pointer; transition: border-color var(--transition); min-width: 140px; }
    .filter-select:focus { outline: none; border-color: var(--accent); }

    /* Buttons */
    .btn { padding: 10px 18px; border-radius: var(--radius-sm); border: none; font-family: var(--font); font-size: 14px; font-weight: 500; cursor: pointer; transition: all var(--transition); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 12px rgba(99,102,241,0.3); transform: translateY(-1px); }
    .btn-ghost { background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg-card); color: var(--text-primary); }

    /* Add Form */
    .add-form-wrapper { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 24px; overflow: hidden; box-shadow: var(--shadow-sm); transition: box-shadow var(--transition); }
    .add-form-wrapper.open { box-shadow: var(--shadow-md); }
    .form-header { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; transition: background var(--transition); }
    .form-header:hover { background: var(--bg-tertiary); }
    .form-header-left { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; color: var(--text-primary); }
    .form-header-icon { width: 32px; height: 32px; background: var(--accent-light); color: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .form-chevron { color: var(--text-muted); font-size: 20px; transition: transform var(--transition); line-height: 1; }
    .add-form-wrapper.open .form-chevron { transform: rotate(180deg); }
    .form-body { display: none; padding: 0 20px 20px; border-top: 1px solid var(--border-subtle); }
    .add-form-wrapper.open .form-body { display: block; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-label { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
    .form-input, .form-textarea { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-primary); color: var(--text-primary); font-family: var(--font); font-size: 14px; transition: border-color var(--transition), box-shadow var(--transition); }
    .form-input:focus, .form-textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-input::placeholder, .form-textarea::placeholder { color: var(--text-muted); }
    .form-actions { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; }

    /* Star Rating */
    .star-input { display: flex; gap: 4px; align-items: center; }
    .star-input .star { font-size: 26px; cursor: pointer; color: var(--star-empty); transition: color var(--transition), transform var(--transition); user-select: none; line-height: 1; }
    .star-input .star.hovered, .star-input .star.selected { color: var(--star-filled); transform: scale(1.2); }
    .star-rating-display { display: flex; gap: 2px; }
    .star-rating-display .star { font-size: 14px; color: var(--star-empty); }
    .star-rating-display .star.filled { color: var(--star-filled); }

    /* Stats */
    .stats-bar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-chip { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 14px; font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; box-shadow: var(--shadow-sm); }
    .stat-chip strong { color: var(--text-primary); font-weight: 600; }

    /* Items Grid */
    .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

    /* Item Card */
    .item-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow-sm); transition: box-shadow var(--transition), transform var(--transition), border-color var(--transition); display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; animation: fadeInUp 0.25s ease both; }
    .item-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); opacity: 0; transition: opacity var(--transition); }
    .item-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--accent); }
    .item-card:hover::before { opacity: 1; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .card-title { font-size: 16px; font-weight: 600; color: var(--text-primary); line-height: 1.3; }
    .card-delete { width: 30px; height: 30px; border: none; background: none; color: var(--text-muted); cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all var(--transition); flex-shrink: 0; }
    .card-delete:hover { background: var(--danger-light); color: var(--danger); }
    .card-creator { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
    .card-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .card-genre { font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 20px; background: var(--accent-light); color: var(--accent); }
    .card-date { font-size: 12px; color: var(--text-muted); }
    .card-notes { font-size: 13px; color: var(--text-secondary); line-height: 1.5; border-top: 1px solid var(--border-subtle); padding-top: 10px; }

    /* Empty State */
    .empty-state { text-align: center; padding: 60px 24px; color: var(--text-muted); grid-column: 1/-1; }
    .empty-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.6; }
    .empty-title { font-size: 18px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
    .empty-desc { font-size: 14px; max-width: 340px; margin: 0 auto; line-height: 1.6; }

    /* Recommendations */
    .recs-header { margin-bottom: 28px; }
    .recs-title { font-size: 22px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
    .recs-subtitle { font-size: 14px; color: var(--text-secondary); }
    .recs-section { margin-bottom: 36px; }
    .recs-section-title { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
    .recs-section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .rec-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .rec-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; box-shadow: var(--shadow-sm); transition: box-shadow var(--transition), transform var(--transition); display: flex; flex-direction: column; gap: 8px; animation: fadeInUp 0.25s ease both; }
    .rec-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .rec-title { font-size: 15px; font-weight: 600; color: var(--text-primary); line-height: 1.3; }
    .rec-creator { font-size: 13px; color: var(--text-secondary); }
    .rec-reason { font-size: 12px; color: var(--accent); background: var(--accent-light); padding: 5px 10px; border-radius: 6px; margin-top: 4px; }
    .rec-genre-tag { display: inline-flex; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; background: var(--accent-2-light); color: var(--accent-2); width: fit-content; }
    .no-recs { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; background: var(--bg-card); border: 1px dashed var(--border); border-radius: var(--radius-lg); line-height: 1.6; }

    /* Toast */
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 18px; font-size: 14px; color: var(--text-primary); box-shadow: var(--shadow-lg); z-index: 999; display: flex; align-items: center; gap: 10px; transform: translateY(100px); opacity: 0; transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1); max-width: 320px; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast-icon { font-size: 20px; flex-shrink: 0; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 640px) {
      .header-inner { height: 56px; }
      .main { padding: 16px 14px 48px; }
      .logo-text { font-size: 17px; }
      .tab-btn { padding: 12px 12px; font-size: 13px; }
      .form-grid { grid-template-columns: 1fr; }
      .items-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 380px) {
      .tab-btn .tab-label { display: none; }
      .tab-btn { padding: 12px 10px; }
    }
  </style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <a class="logo" href="#">
      <div class="logo-icon">📚</div>
      <span class="logo-text">Book<span>Cine</span></span>
    </a>
    <button class="dark-toggle" id="darkToggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  </div>
</header>

<nav class="nav-tabs" role="tablist">
  <div class="nav-tabs-inner">
    <button class="tab-btn active" role="tab" data-tab="books" aria-selected="true">
      📖 <span class="tab-label">Books</span>
      <span class="badge" id="booksBadge">0</span>
    </button>
    <button class="tab-btn" role="tab" data-tab="movies" aria-selected="false">
      🎬 <span class="tab-label">Movies</span>
      <span class="badge" id="moviesBadge">0</span>
    </button>
    <button class="tab-btn" role="tab" data-tab="recs" aria-selected="false">
      ✨ <span class="tab-label">Recommendations</span>
    </button>
  </div>
</nav>

<main class="main">

  <!-- BOOKS TAB -->
  <div class="tab-panel active" id="tab-books" role="tabpanel">
    <div class="add-form-wrapper" id="bookFormWrapper">
      <div class="form-header" id="bookFormToggle">
        <div class="form-header-left">
          <div class="form-header-icon">➕</div>
          Add a Book
        </div>
        <span class="form-chevron">⌄</span>
      </div>
      <div class="form-body">
        <form id="bookForm" novalidate>
          <div class="form-grid">
            <div class="form-field">
              <label class="form-label" for="bookTitle">Title *</label>
              <input class="form-input" type="text" id="bookTitle" placeholder="e.g. Dune" required />
            </div>
            <div class="form-field">
              <label class="form-label" for="bookAuthor">Author *</label>
              <input class="form-input" type="text" id="bookAuthor" placeholder="e.g. Frank Herbert" required />
            </div>
            <div class="form-field">
              <label class="form-label" for="bookGenre">Genre *</label>
              <select class="form-input" id="bookGenre" required style="width:100%">
                <option value="" disabled selected>Select genre…</option>
                <option>Science Fiction</option><option>Fantasy</option><option>Mystery</option>
                <option>Thriller</option><option>Romance</option><option>Historical Fiction</option>
                <option>Biography</option><option>Horror</option><option>Literary Fiction</option>
                <option>Adventure</option><option>Other</option>
              </select>
            </div>
            <div class="form-field">
              <label class="form-label" for="bookDate">Date Read</label>
              <input class="form-input" type="date" id="bookDate" />
            </div>
            <div class="form-field">
              <label class="form-label">Your Rating *</label>
              <div class="star-input" id="bookStars" data-rating="0">
                <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span>
                <span class="star" data-v="3">★</span><span class="star" data-v="4">★</span>
                <span class="star" data-v="5">★</span>
              </div>
            </div>
            <div class="form-field full">
              <label class="form-label" for="bookNotes">Notes</label>
              <textarea class="form-textarea" id="bookNotes" placeholder="Your thoughts, favourite quotes, memorable passages…"></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-ghost" id="bookFormCancel">Cancel</button>
            <button type="submit" class="btn btn-primary">💾 Save Book</button>
          </div>
        </form>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" type="search" id="bookSearch" placeholder="Search by title or author…" />
      </div>
      <select class="filter-select" id="bookFilter">
        <option value="">All genres</option>
        <option>Science Fiction</option><option>Fantasy</option><option>Mystery</option>
        <option>Thriller</option><option>Romance</option><option>Historical Fiction</option>
        <option>Biography</option><option>Horror</option><option>Literary Fiction</option>
        <option>Adventure</option><option>Other</option>
      </select>
      <select class="filter-select" id="bookSort" style="min-width:140px">
        <option value="added-desc">Newest added</option>
        <option value="added-asc">Oldest added</option>
        <option value="rating-desc">Highest rated</option>
        <option value="rating-asc">Lowest rated</option>
        <option value="title-asc">A → Z</option>
      </select>
    </div>

    <div class="stats-bar" id="booksStats"></div>
    <div class="items-grid" id="booksGrid"></div>
  </div>

  <!-- MOVIES TAB -->
  <div class="tab-panel" id="tab-movies" role="tabpanel">
    <div class="add-form-wrapper" id="movieFormWrapper">
      <div class="form-header" id="movieFormToggle">
        <div class="form-header-left">
          <div class="form-header-icon">➕</div>
          Add a Movie
        </div>
        <span class="form-chevron">⌄</span>
      </div>
      <div class="form-body">
        <form id="movieForm" novalidate>
          <div class="form-grid">
            <div class="form-field">
              <label class="form-label" for="movieTitle">Title *</label>
              <input class="form-input" type="text" id="movieTitle" placeholder="e.g. Interstellar" required />
            </div>
            <div class="form-field">
              <label class="form-label" for="movieDirector">Director *</label>
              <input class="form-input" type="text" id="movieDirector" placeholder="e.g. Christopher Nolan" required />
            </div>
            <div class="form-field">
              <label class="form-label" for="movieGenre">Genre *</label>
              <select class="form-input" id="movieGenre" required style="width:100%">
                <option value="" disabled selected>Select genre…</option>
                <option>Science Fiction</option><option>Fantasy</option><option>Mystery</option>
                <option>Thriller</option><option>Romance</option><option>Historical</option>
                <option>Biography</option><option>Horror</option><option>Action/Adventure</option>
                <option>Drama</option><option>Other</option>
              </select>
            </div>
            <div class="form-field">
              <label class="form-label" for="movieDate">Date Watched</label>
              <input class="form-input" type="date" id="movieDate" />
            </div>
            <div class="form-field">
              <label class="form-label">Your Rating *</label>
              <div class="star-input" id="movieStars" data-rating="0">
                <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span>
                <span class="star" data-v="3">★</span><span class="star" data-v="4">★</span>
                <span class="star" data-v="5">★</span>
              </div>
            </div>
            <div class="form-field full">
              <label class="form-label" for="movieNotes">Notes</label>
              <textarea class="form-textarea" id="movieNotes" placeholder="Your thoughts, favourite scenes, standout performances…"></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-ghost" id="movieFormCancel">Cancel</button>
            <button type="submit" class="btn btn-primary">💾 Save Movie</button>
          </div>
        </form>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" type="search" id="movieSearch" placeholder="Search by title or director…" />
      </div>
      <select class="filter-select" id="movieFilter">

function initStarInput(id) {
  const c = document.getElementById(id);
  const stars = c.querySelectorAll('.star');
  stars.forEach(s => {
    s.addEventListener('mouseenter', () => {
      const v = +s.dataset.v;
      stars.forEach(x => x.classList.toggle('hovered', +x.dataset.v <= v));
    });
    s.addEventListener('mouseleave', () => stars.forEach(x => x.classList.remove('hovered')));
    s.addEventListener('click', () => {
      const v = +s.dataset.v;
      c.dataset.rating = v;
      stars.forEach(x => x.classList.toggle('selected', +x.dataset.v <= v));
    });
  });
}

function getStarRating(id) { return +document.getElementById(id).dataset.rating; }

function resetStarInput(id) {
  const c = document.getElementById(id);
  c.dataset.rating = '0';
  c.querySelectorAll('.star').forEach(s => s.classList.remove('selected','hovered'));
}

let toastTimer;
function showToast(msg, icon) {
  icon = icon || '✅';
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastIcon').textContent = icon;
  t.classList.add('show');

}

/* ================================================================
   HELPERS
================================================================ */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(s) {
  if (!s) return '';
  try { return new Date(s+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); }
  catch(e){ return s; }
}

function starsHTML(r) {
  let h = '<div class="star-rating-display">';
  for (let i=1;i<=5;i++) h += `<span class="star ${i<=r?'filled':''}">★</span>`;
  return h + '</div>';
}

function avgRating(arr) {
  if (!arr.length) return '—';
  return (arr.reduce((s,x) => s+x.rating, 0)/arr.length).toFixed(1);
}

function sortItems(arr, by) {
  const a = [...arr];
  if (by==='added-desc')   return a.sort((x,y)=>(y.added||0)-(x.added||0));
  if (by==='added-asc')    return a.sort((x,y)=>(x.added||0)-(y.added||0));
  if (by==='rating-desc')  return a.sort((x,y)=>y.rating-x.rating);
  if (by==='rating-asc')   return a.sort((x,y)=>x.rating-y.rating);
  if (by==='title-asc')    return a.sort((x,y)=>x.title.localeCompare(y.title));
  return a;
}

/* ================================================================
   RECOMMENDATIONS ENGINE
================================================================ */
function topGenres(items, minRating) {
  minRating = minRating || 4;
  const scores = {};
  items.filter(x => x.rating >= minRating).forEach(x => {
    scores[x.genre] = (scores[x.genre] || 0) + x.rating;
  });
  return Object.entries(scores).sort((a,b) => b[1]-a[1]).map(e => e[0]);
}

function buildRecs(items, catalog, maxTotal) {
  maxTotal = maxTotal || 9;
  const genres = topGenres(items, 4);
  if (!genres.length) return null;
  const owned = new Set(items.map(x => x.title.toLowerCase().trim()));
  const results = [];
  for (const g of genres) {
    if (!catalog[g]) continue;
    // Shuffle lightly so repeated visits show variety
    const pool = catalog[g].filter(r => !owned.has(r.title.toLowerCase().trim()));
    const shuffled = pool.sort(() => Math.random() - 0.45);
    const picks = shuffled.slice(0, 3);
    picks.forEach(p => results.push({...p, genre:g, reason:`Because you love ${g}`}));
    if (results.length >= maxTotal) break;
  }
  return results.slice(0, maxTotal);
}

function renderRecs() {
  const container = document.getElementById('recsContent');
  const bookRecs  = buildRecs(books, BOOK_RECS);
  const movieRecs = buildRecs(movies, MOVIE_RECS);

  if (!bookRecs && !movieRecs) {
    const hasAny = books.length || movies.length;
    container.innerHTML = `<div class="no-recs">
      <div style="font-size:52px;margin-bottom:16px">${hasAny?'⭐':'📋'}</div>
      <div style="font-size:17px;font-weight:600;color:var(--text-secondary);margin-bottom:10px">
        ${hasAny?'Rate items 4 stars or higher to unlock recommendations':'Your library is empty'}
      </div>
      <div>${hasAny
        ?'Add ratings of ★★★★ or ★★★★★ to your books and movies — we\'ll surface similar titles from our curated catalogue.'
        :'Head to the Books or Movies tabs and start adding titles. Once you\'ve rated a few with 4+ stars, personalised recommendations will appear here.'}</div>
    </div>`;
    return;
  }

  function recSection(title, recs, showEmpty, emptyMsg) {
    if (!recs || !recs.length) {
      if (!showEmpty) return '';
      return `<div class="recs-section">
        <div class="recs-section-title">${title}</div>
        <div class="no-recs" style="padding:22px">${emptyMsg}</div>
      </div>`;
    }
    return `<div class="recs-section">
      <div class="recs-section-title">${title}</div>
      <div class="rec-cards">
        ${recs.map((r,i) => `
          <div class="rec-card" style="animation-delay:${i*0.05}s">
            <div class="rec-title">${esc(r.title)}</div>
            <div class="rec-creator">${esc(r.creator)}</div>
            <span class="rec-genre-tag">${esc(r.genre)}</span>
            <div class="rec-reason">💡 ${esc(r.reason)}</div>
          </div>`).join('')}
      </div>
    </div>`;
  }

  container.innerHTML =
    recSection('📖 Book Recommendations', bookRecs, !!books.length, 'Rate some books ★★★★ or higher to get book recommendations.') +
    recSection('🎬 Movie Recommendations', movieRecs, !!movies.length, 'Rate some movies ★★★★ or higher to get movie recommendations.');
}

/* ================================================================
   INIT
================================================================ */
(function init() {
  loadAll();
  applyTheme();
  initStarInput('bookStars');
  initStarInput('movieStars');
  // Default dates to today
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('bookDate').value  = today;
  document.getElementById('movieDate').value = today;
  renderBooks();
  renderMovies();
})();
</script>
</body>
